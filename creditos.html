    <!-- JavaScript donde se captura la parte de arriba de la pagina: header-->
    <script>
        window.addEventListener("scroll", function () {
            var header = document.querySelector("nav");
            header.classList.toggle("abajo", window.scrollY > 0);
        }, { passive: true });
    </script>

    <!-- JavaScript para animación de enlaces -->
    <script>
        // 1. Creamos el array de letras automáticamente
        document.querySelectorAll('.link-animado').forEach(link => {
        link.innerHTML = link.textContent.split('').map(letra => 
            `<span>${letra}</span>`
        ).join('');
        });

        // 2. Animación al hacer hover
        document.querySelectorAll('.link-animado').forEach(link => {
        link.addEventListener('mouseenter', () => {
            anime.timeline({ loop: false })
            .add({
                targets: link.querySelectorAll('span'),
                translateY: -10, // salto hacia arriba
                duration: 400,
                easing: 'easeOutElastic(1, .6)',
                delay: anime.stagger(40) // LA OLA: 40ms entre cada letra
            })
            .add({
                targets: link.querySelectorAll('span'),
                translateY: 0, // vuelta al origen
                duration: 600,
                easing: 'easeOutElastic(1, .6)',
                delay: anime.stagger(40),
                // se queda 1 segundo arriba antes de volver
            }, '+=800'); // +=800 = espera 0.8s
        });
        });
    </script>

    <!-- JavaScript para establecer el volumen inicial -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var audio = document.getElementById('background-music');
            audio.volume = 0.5; // Establecí el volumen al 50%

            var toggleButton = document.getElementById('volume-btn');
            var isMuted = false;

            toggleButton.addEventListener('click', function () {
                isMuted = !isMuted; // Cambiar el estado de mute
                audio.volume = isMuted ? 0 : 0.5; // Silenciar o restaurar el volumen

                // Cambiar el estado del botón
                toggleButton.classList.toggle('active', !isMuted);
            });
        });
    </script>
